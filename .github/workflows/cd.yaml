name: Release plugin
on:
  workflow_dispatch:
    inputs:
      validate_only:
        type: boolean
        default: true
        description: Validate and draft release notes without publishing
permissions:
  checks: read
  contents: write
jobs:
  maven-cd:
    if: github.repository == 'jenkinsci/bytebase-plugin'
    uses: jenkins-infra/github-reusable-workflows/.github/workflows/maven-cd.yml@c2470861b1ad94810dc0d207b011e0b57bb91bbb # v1
    with:
      validate_only: ${{ inputs.validate_only }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
